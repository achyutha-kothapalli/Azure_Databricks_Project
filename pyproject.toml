[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adventure-works-azure-data-platform"
version = "0.1.0"
description = "Productionization of an Adventure Works data platform on Azure and Databricks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "pyyaml>=6.0,<7.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]
spark = [
  "delta-spark>=3.3,<3.4",
  "pyspark>=3.5,<3.6",
]

[project.scripts]
silver_pipeline = "adventure_works.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
